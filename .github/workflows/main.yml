name: Linux Build

on:
  push:
    branches: master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y clang cmake make libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
    - name: Build for Linux x64
      run: mkdir build && cd build && cmake -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ .. && make
    - name: Compress Linux x64 artifact
      run: tar -czvf nivlr.tar.gz build/nivlr res
    - name: Upload Linux x64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: Noctis IV LR Linux x64 Build
        path: nivlr.tar.gz
